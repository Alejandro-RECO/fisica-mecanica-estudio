# Glosario del curso.
#
# Reglas: la definicion no puede ser circular, tiene ejemplo con unidades y
# cabe en un tooltip. Los simbolos van en unicode plano (LT⁻¹, m/s²), no en
# KaTeX: aqui no hay renderizador.
#
# Solo entran terminos de una unidad ya fichada. Un termino de cinematica no
# se escribe antes de fichar `cinematica1.pdf`: seria memoria del modelo con
# formato de fuente.

# --- Vectores ---

- id: vector-unitario
  termino: Vector unitario
  categoria: Vectores
  definicion: >
    Vector de magnitud exactamente 1 y sin unidades, cuyo único aporte es la dirección.
    Se obtiene dividiendo un vector entre su propia magnitud, Â = A⃗/|A⃗|, y permite escribir
    cualquier vector como magnitud por dirección: A⃗ = |A⃗| Â. El sombrero va sobre la misma
    letra del vector; û se reserva para un unitario genérico que no viene de ningún vector con
    nombre.
  ejemplo: >
    Para F⃗ = (60î + 80ĵ) N, la magnitud es 100 N y el unitario es F̂ = 0,6î + 0,8ĵ, sin unidades.
    Una fuerza de 250 N en esa misma dirección es 250 N · F̂ = (150î + 200ĵ) N.
  ver:
    - base-cartesiana

- id: base-cartesiana
  termino: Base cartesiana
  categoria: Vectores
  definicion: >
    El trío de vectores unitarios î, ĵ y k̂ que apuntan en el sentido positivo de los ejes x, y
    y z. Son perpendiculares entre sí y permiten escribir cualquier vector como suma de sus
    componentes.
  ejemplo: >
    Un desplazamiento de 3 m al oriente y 4 m al norte se escribe d⃗ = (3î + 4ĵ) m, con el eje x
    hacia el oriente y el eje y hacia el norte.
  ver:
    - vector-unitario
