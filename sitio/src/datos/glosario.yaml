# Glosario del curso.
#
# Reglas: la definicion no puede ser circular, tiene ejemplo con unidades y
# cabe en un tooltip. Los simbolos van en unicode plano (LT⁻¹, m/s²), no en
# KaTeX: aqui no hay renderizador.

- id: sistema-de-referencia
  termino: Sistema de referencia
  categoria: Cinemática
  definicion: >
    El punto y los ejes desde los que se mide la posición. Sin declararlo, un signo no
    significa nada: decir que la aceleración es negativa solo tiene sentido si ya se dijo
    hacia dónde apunta el eje positivo.
  ejemplo: >
    Con el eje y positivo hacia arriba, un objeto en caída libre tiene a = −9,81 m/s².
    Con el eje hacia abajo, el mismo objeto tiene a = +9,81 m/s².
  ver:
    - desplazamiento

- id: desplazamiento
  termino: Desplazamiento
  categoria: Cinemática
  definicion: >
    El cambio de posición: la posición final menos la inicial. Tiene signo y dirección,
    y no depende del camino recorrido.
  ejemplo: >
    Si sales de tu casa, caminas 300 m y vuelves, recorriste 600 m de distancia pero tu
    desplazamiento es 0 m.
  ver:
    - sistema-de-referencia
    - velocidad-media

- id: velocidad-media
  termino: Velocidad media
  categoria: Cinemática
  definicion: >
    El desplazamiento dividido entre el tiempo que tomó. Describe el viaje completo como
    si hubiera sido uniforme, y por eso no describe ningún instante en particular.
  ejemplo: >
    Un bus que hace 120 km en 2 h tiene velocidad media de 60 km/h, aunque nunca haya
    marcado exactamente 60 km/h en el velocímetro.
  ver:
    - desplazamiento

# --- Vectores ---

- id: vector-unitario
  termino: Vector unitario
  categoria: Vectores
  definicion: >
    Vector de magnitud exactamente 1 y sin unidades, cuyo único aporte es la dirección.
    Se obtiene dividiendo un vector entre su propia magnitud, û = A⃗/|A⃗|, y permite escribir
    cualquier vector como magnitud por dirección: A⃗ = |A⃗| û.
  ejemplo: >
    Para F⃗ = (60î + 80ĵ) N, la magnitud es 100 N y el unitario es û = 0,6î + 0,8ĵ, sin unidades.
    Una fuerza de 250 N en esa misma dirección es 250 N · û = (150î + 200ĵ) N.
  ver:
    - base-cartesiana

- id: base-cartesiana
  termino: Base cartesiana
  categoria: Vectores
  definicion: >
    El trío de vectores unitarios î, ĵ y k̂ que apuntan en el sentido positivo de los ejes x, y
    y z. Son perpendiculares entre sí y permiten escribir cualquier vector como suma de sus
    componentes.
  ejemplo: >
    Un desplazamiento de 3 m al oriente y 4 m al norte se escribe d⃗ = (3î + 4ĵ) m, con el eje x
    hacia el oriente y el eje y hacia el norte.
  ver:
    - vector-unitario
